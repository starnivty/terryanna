<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Little Corner</title>

    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #fcfaf8;
            color: #24201f;
        }

        button {
            font: inherit;
        }


        /* =========================================
           PAGE
        ========================================= */

        .page {
            width: min(1400px, 100%);
            margin: 0 auto;

            padding: 28px 60px 60px;
        }


        /* =========================================
           HEADER
        ========================================= */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;

            margin-bottom: 48px;
        }

        .greeting h1 {
            font-family: Georgia, serif;

            font-size: 34px;
            font-weight: 500;

            line-height: 1.1;
        }

        .greeting p {
            margin-top: 8px;

            color: #766d69;

            font-family: Georgia, serif;
            font-size: 18px;
        }

        .current-date {
            display: flex;
            align-items: center;
            gap: 10px;

            padding-top: 6px;

            color: #766d69;

            font-family: Georgia, serif;
            font-size: 18px;
        }


        /* =========================================
           DASHBOARD GRID
        ========================================= */

        .dashboard {
            display: grid;

            grid-template-columns:
                minmax(0, 1.25fr)
                minmax(0, 1fr);

            gap: 28px;
        }


        /* =========================================
           GENERAL CARD
        ========================================= */

        .dashboard-card {
            background: #fffdfb;

            border: 1px solid #eee7e2;
            border-radius: 26px;

            box-shadow:
                0 8px 30px rgba(80, 60, 50, 0.07);

            overflow: hidden;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 28px 30px 18px;
        }

        .card-header h2 {
            font-family: Georgia, serif;

            font-size: 28px;
            font-weight: 500;
        }


        /* =========================================
           BUTTON
        ========================================= */

        .soft-button {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 10px 17px;

            border: 1px solid #eadbd7;
            border-radius: 12px;

            background: #f9e9e7;
            color: #814c4d;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .soft-button:hover {
            background: #f4dddd;
            transform: translateY(-1px);
        }


        /* =========================================
           CALENDAR
        ========================================= */

        .calendar-card {
            min-height: 480px;
        }

        .calendar-content {
            padding: 10px 30px 30px;
        }

        .calendar-navigation {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 22px;
        }

        .month-title {
            font-family: Georgia, serif;

            font-size: 25px;
        }

        .calendar-arrow {
            width: 38px;
            height: 38px;

            border: none;
            background: transparent;

            font-size: 25px;

            cursor: pointer;

            color: #292322;
        }

        .weekdays,
        .calendar-grid {
            display: grid;

            grid-template-columns:
                repeat(7, 1fr);
        }

        .weekdays {
            margin-bottom: 10px;
        }

        .weekday {
            text-align: center;

            color: #776e6a;

            font-size: 14px;
        }

        .weekday:first-child {
            color: #bd7378;
        }

        .calendar-day {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            height: 48px;

            font-size: 15px;
        }

        .calendar-day.other-month {
            color: #c4bebb;
        }

        .calendar-day.today span {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 44px;
            height: 44px;

            border-radius: 50%;

            background: #f4d9da;
            color: #8b4c50;
        }

        .calendar-day.has-event::after {
            content: "";

            position: absolute;

            bottom: 3px;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #bd7378;
        }


        /* =========================================
           DAY COUNTER
        ========================================= */

        .counter-card {
            min-height: 480px;
        }

        .counter-navigation {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .counter-arrow {
            border: none;
            background: transparent;

            font-size: 23px;

            cursor: pointer;

            color: #292322;
        }

        .counter-position {
            color: #776e6a;
            font-size: 14px;
        }

        .counter-body {
            display: grid;

            grid-template-columns:
                1.1fr
                1fr;

            gap: 0;

            margin: 10px 20px 20px;

            min-height: 365px;

            border: 1px solid #eee7e2;
            border-radius: 22px;

            overflow: hidden;
        }

        .counter-image {
            width: 100%;
            height: 100%;

            min-height: 365px;

            object-fit: cover;

            background: #e9e4e0;
        }

        .counter-info {
            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            padding: 30px;

            text-align: center;
        }

        .counter-title {
            font-family: Georgia, serif;

            font-size: 27px;
            font-weight: 500;

            margin-bottom: 18px;
        }

        .counter-date {
            color: #bd7378;

            font-family: Georgia, serif;
            font-size: 17px;
        }

        .counter-divider {
            width: 80%;

            height: 1px;

            margin: 28px 0;

            background: #e9dfdb;
        }

        .counter-number {
            font-family: Georgia, serif;

            font-size: 82px;
            line-height: 0.9;

            color: #b96970;
        }

        .counter-label {
            margin-top: 12px;

            color: #766d69;

            font-size: 16px;
        }

        .counter-dots {
            display: flex;
            gap: 10px;

            margin-top: 25px;
        }

        .counter-dot {
            width: 10px;
            height: 10px;

            border: none;
            border-radius: 50%;

            background: #c9c7c6;

            cursor: pointer;
        }

        .counter-dot.active {
            background: #bd7378;
        }


        /* =========================================
           GALLERY
        ========================================= */

        .gallery-card {
            min-height: 300px;
        }

        .gallery-content {
            padding: 0 22px 25px;
        }

        .gallery-grid {
            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 8px;
        }

        .gallery-item {
            width: 100%;
            aspect-ratio: 0.72;

            overflow: hidden;

            border-radius: 12px;

            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            transition:
                transform 0.35s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .gallery-dots {
            display: flex;
            justify-content: center;

            gap: 7px;

            margin-top: 16px;
        }

        .gallery-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #d2d0cf;
        }

        .gallery-dot.active {
            background: #bd7378;
        }


        /* =========================================
           NOTES
        ========================================= */

        .notes-card {
            min-height: 300px;
        }

        .notes-content {
            padding: 0 22px 25px;
        }

        .note-preview {
            position: relative;

            min-height: 200px;

            display: flex;
            align-items: center;

            padding: 40px;

            border: 1px solid #eadbd7;
            border-radius: 22px;

            background: #fbefee;
        }

        .quote-mark {
            position: absolute;

            top: 15px;
            left: 25px;

            font-family: Georgia, serif;
            font-size: 55px;

            color: #dfadb0;
        }

        .note-text {
            max-width: 500px;

            font-family: Georgia, serif;

            font-size: 25px;
            line-height: 1.4;
        }

        .note-updated {
            position: absolute;

            bottom: 18px;
            left: 25px;

            color: #776e6a;

            font-size: 13px;
        }


        /* =========================================
           MODAL
        ========================================= */

        .modal {
            position: fixed;

            inset: 0;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(30, 25, 23, 0.45);

            z-index: 100;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            width: min(600px, 100%);

            padding: 30px;

            border-radius: 25px;

            background: #fffdfb;

            box-shadow:
                0 20px 70px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 25px;
        }

        .modal-header h2 {
            font-family: Georgia, serif;
            font-size: 28px;
        }

        .close-modal {
            width: 38px;
            height: 38px;

            border: none;
            border-radius: 50%;

            background: #f4eeee;

            cursor: pointer;

            font-size: 20px;
        }

        .note-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .note-item {
            padding: 18px;

            border-radius: 15px;

            background: #fbefee;
        }

        .note-item-date {
            margin-bottom: 5px;

            color: #bd7378;

            font-size: 13px;
        }

        .note-item-text {
            font-family: Georgia, serif;

            font-size: 17px;
            line-height: 1.5;
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 1000px) {

            .page {
                padding: 25px;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }

            .calendar-card,
            .counter-card {
                min-height: auto;
            }

        }


        @media (max-width: 650px) {

            .page {
                padding: 20px 15px 40px;
            }

            .header {
                margin-bottom: 25px;
            }

            .greeting h1 {
                font-size: 27px;
            }

            .greeting p {
                font-size: 15px;
            }

            .current-date {
                display: none;
            }

            .dashboard {
                gap: 18px;
            }

            .card-header {
                padding: 22px 20px 15px;
            }

            .card-header h2 {
                font-size: 24px;
            }

            .counter-body {
                grid-template-columns: 1fr;

                margin: 5px 15px 15px;
            }

            .counter-image {
                min-height: 260px;
                height: 260px;
            }

            .counter-info {
                min-height: 280px;
            }

            .counter-number {
                font-size: 70px;
            }

            .gallery-grid {
                grid-template-columns:
                    repeat(3, 1fr);

                overflow: hidden;
            }

            .gallery-item:nth-child(n + 4) {
                display: none;
            }

            .note-preview {
                padding: 35px 25px;
            }

            .note-text {
                font-size: 21px;
            }

        }

    </style>
</head>


<body>

<div class="page">

    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="header">

        <div class="greeting">

            <h1>
                Hello, Aleyna
            </h1>

            <p>
                Your little corner of memories
            </p>

        </div>


        <div class="current-date">

            <span>◫</span>

            <span id="currentDate">
                20 August 2026
            </span>

        </div>

    </header>



    <!-- =========================================
         DASHBOARD
    ========================================== -->

    <main class="dashboard">


        <!-- =====================================
             CALENDAR
        ====================================== -->

        <section class="dashboard-card calendar-card">

            <div class="card-header">

                <h2>
                    Calendar
                </h2>

                <button
                    class="soft-button"
                    id="fullCalendarButton"
                >
                    View full calendar
                    <span>→</span>
                </button>

            </div>


            <div class="calendar-content">

                <div class="calendar-navigation">

                    <button
                        class="calendar-arrow"
                        id="previousMonth"
                    >
                        ‹
                    </button>

                    <h3
                        class="month-title"
                        id="monthTitle"
                    ></h3>

                    <button
                        class="calendar-arrow"
                        id="nextMonth"
                    >
                        ›
                    </button>

                </div>


                <div class="weekdays">

                    <div class="weekday">Sun</div>
                    <div class="weekday">Mon</div>
                    <div class="weekday">Tue</div>
                    <div class="weekday">Wed</div>
                    <div class="weekday">Thu</div>
                    <div class="weekday">Fri</div>
                    <div class="weekday">Sat</div>

                </div>


                <div
                    class="calendar-grid"
                    id="calendarGrid"
                ></div>

            </div>

        </section>



        <!-- =====================================
             DAY COUNTER
        ====================================== -->

        <section class="dashboard-card counter-card">

            <div class="card-header">

                <h2>
                    Day Counter
                </h2>


                <div class="counter-navigation">

                    <button
                        class="counter-arrow"
                        id="previousCounter"
                    >
                        ‹
                    </button>

                    <span
                        class="counter-position"
                        id="counterPosition"
                    >
                        1 / 3
                    </span>

                    <button
                        class="counter-arrow"
                        id="nextCounter"
                    >
                        ›
                    </button>

                </div>

            </div>


            <div class="counter-body">

                <img
                    class="counter-image"
                    id="counterImage"
                    src=""
                    alt=""
                >


                <div class="counter-info">

                    <h3
                        class="counter-title"
                        id="counterTitle"
                    ></h3>

                    <p
                        class="counter-date"
                        id="counterDate"
                    ></p>

                    <div class="counter-divider"></div>

                    <div
                        class="counter-number"
                        id="counterNumber"
                    >
                    </div>

                    <p class="counter-label">
                        days since
                    </p>


                    <div
                        class="counter-dots"
                        id="counterDots"
                    ></div>

                </div>

            </div>

        </section>



        <!-- =====================================
             GALLERY
        ====================================== -->

        <section class="dashboard-card gallery-card">

            <div class="card-header">

                <h2>
                    Gallery
                </h2>

                <button
                    class="soft-button"
                    id="showGallery"
                >
                    Show more
                    <span>→</span>
                </button>

            </div>


            <div class="gallery-content">

                <div
                    class="gallery-grid"
                    id="galleryGrid"
                ></div>


                <div class="gallery-dots">

                    <span class="gallery-dot active"></span>
                    <span class="gallery-dot"></span>
                    <span class="gallery-dot"></span>
                    <span class="gallery-dot"></span>
                    <span class="gallery-dot"></span>

                </div>

            </div>

        </section>



        <!-- =====================================
             NOTES
        ====================================== -->

        <section class="dashboard-card notes-card">

            <div class="card-header">

                <h2>
                    Notes
                </h2>

                <button
                    class="soft-button"
                    id="openNotes"
                >
                    Open notes
                    <span>→</span>
                </button>

            </div>


            <div class="notes-content">

                <div class="note-preview">

                    <div class="quote-mark">
                        “
                    </div>

                    <p
                        class="note-text"
                        id="notePreview"
                    ></p>

                    <span class="note-updated">
                        Updated 2 hours ago
                    </span>

                </div>

            </div>

        </section>

    </main>

</div>



<!-- =========================================
     NOTES MODAL
========================================== -->

<div
    class="modal"
    id="notesModal"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2>
                My Notes
            </h2>

            <button
                class="close-modal"
                id="closeNotes"
            >
                ×
            </button>

        </div>


        <div
            class="note-list"
            id="noteList"
        ></div>

    </div>

</div>



<script>

    /* =========================================
       DATA
    ========================================== */


    const counters = [

        {
            id: 1,

            title: "Our First Date",

            date: "2026-08-07",

            image:
                "images/counter-1.jpg"
        },


        {
            id: 2,

            title: "First Concert",

            date: "2026-08-10",

            image:
                "images/counter-2.jpg"
        },


        {
            id: 3,

            title: "Japan Trip",

            date: "2026-08-12",

            image:
                "images/counter-3.jpg"
        }

    ];


    const galleryImages = [

        "images/gallery-1.jpg",
        "images/gallery-2.jpg",
        "images/gallery-3.jpg",
        "images/gallery-4.jpg",
        "images/gallery-5.jpg"

    ];


    const notes = [

        {
            date: "20 August 2026",

            text:
                "Be proud of how far you've come."
        },


        {
            date: "18 August 2026",

            text:
                "Don't forget to take a little time for yourself today."
        },


        {
            date: "15 August 2026",

            text:
                "Some memories deserve to be kept forever."
        }

    ];


    /* =========================================
       CURRENT DATE
    ========================================== */

    const today = new Date();

    document.getElementById(
        "currentDate"
    ).textContent =
        today.toLocaleDateString(
            "en-US",
            {
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );


    /* =========================================
       DAY COUNTER
    ========================================== */

    let counterIndex = 0;


    function calculateDays(dateString) {

        const startDate =
            new Date(dateString);

        const today =
            new Date();

        startDate.setHours(0, 0, 0, 0);
        today.setHours(0, 0, 0, 0);


        const difference =
            today.getTime()
            - startDate.getTime();


        return Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );

    }


    function formatDate(dateString) {

        const date =
            new Date(dateString);


        return date.toLocaleDateString(
            "en-US",
            {
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );

    }


    function renderCounter() {

        const counter =
            counters[counterIndex];


        const days =
            calculateDays(
                counter.date
            );


        document.getElementById(
            "counterImage"
        ).src =
            counter.image;


        document.getElementById(
            "counterImage"
        ).alt =
            counter.title;


        document.getElementById(
            "counterTitle"
        ).textContent =
            counter.title;


        document.getElementById(
            "counterDate"
        ).textContent =
            formatDate(
                counter.date
            );


        document.getElementById(
            "counterNumber"
        ).textContent =
            days;


        document.getElementById(
            "counterPosition"
        ).textContent =
            `${counterIndex + 1} / ${counters.length}`;


        renderCounterDots();

    }


    function renderCounterDots() {

        const container =
            document.getElementById(
                "counterDots"
            );


        container.innerHTML = "";


        counters.forEach(
            (counter, index) => {

                const dot =
                    document.createElement(
                        "button"
                    );


                dot.className =
                    "counter-dot";


                if (
                    index === counterIndex
                ) {

                    dot.classList.add(
                        "active"
                    );

                }


                dot.addEventListener(
                    "click",
                    () => {

                        counterIndex =
                            index;

                        renderCounter();

                    }
                );


                container.appendChild(
                    dot
                );

            }
        );

    }


    document
        .getElementById(
            "previousCounter"
        )
        .addEventListener(
            "click",
            () => {

                counterIndex--;

                if (
                    counterIndex < 0
                ) {

                    counterIndex =
                        counters.length - 1;

                }

                renderCounter();

            }
        );


    document
        .getElementById(
            "nextCounter"
        )
        .addEventListener(
            "click",
            () => {

                counterIndex++;

                if (
                    counterIndex >=
                    counters.length
                ) {

                    counterIndex = 0;

                }

                renderCounter();

            }
        );


    renderCounter();



    /* =========================================
       GALLERY
    ========================================== */

    function renderGallery() {

        const container =
            document.getElementById(
                "galleryGrid"
            );


        container.innerHTML = "";


        galleryImages.forEach(
            (image, index) => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "gallery-item";


                const img =
                    document.createElement(
                        "img"
                    );


                img.src = image;

                img.alt =
                    `Gallery photo ${index + 1}`;


                item.appendChild(img);

                container.appendChild(item);

            }
        );

    }


    renderGallery();



    /* =========================================
       NOTES
    ========================================== */

    const notePreview =
        document.getElementById(
            "notePreview"
        );


    notePreview.textContent =
        notes[0].text;


    const noteList =
        document.getElementById(
            "noteList"
        );


    function renderNotes() {

        noteList.innerHTML = "";


        notes.forEach(
            note => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "note-item";


                item.innerHTML = `

                    <div class="note-item-date">
                        ${note.date}
                    </div>

                    <div class="note-item-text">
                        ${note.text}
                    </div>

                `;


                noteList.appendChild(
                    item
                );

            }
        );

    }


    renderNotes();


    const notesModal =
        document.getElementById(
            "notesModal"
        );


    document
        .getElementById("openNotes")
        .addEventListener(
            "click",
            () => {

                notesModal.classList.add(
                    "show"
                );

            }
        );


    document
        .getElementById("closeNotes")
        .addEventListener(
            "click",
            () => {

                notesModal.classList.remove(
                    "show"
                );

            }
        );


    notesModal.addEventListener(
        "click",
        event => {

            if (
                event.target ===
                notesModal
            ) {

                notesModal.classList.remove(
                    "show"
                );

            }

        }
    );



    /* =========================================
       CALENDAR
    ========================================== */

    let calendarDate =
        new Date();


    const importantDates = [

        "2026-08-07",
        "2026-08-12",
        "2026-08-15",
        "2026-08-25"

    ];


    function isSameDate(
        date1,
        date2
    ) {

        return (
            date1.getFullYear() ===
            date2.getFullYear()

            &&

            date1.getMonth() ===
            date2.getMonth()

            &&

            date1.getDate() ===
            date2.getDate()
        );

    }


    function formatDateKey(date) {

        const year =
            date.getFullYear();


        const month =
            String(
                date.getMonth() + 1
            ).padStart(2, "0");


        const day =
            String(
                date.getDate()
            ).padStart(2, "0");


        return `${year}-${month}-${day}`;

    }


    function renderCalendar() {

        const year =
            calendarDate.getFullYear();


        const month =
            calendarDate.getMonth();


        const monthTitle =
            document.getElementById(
                "monthTitle"
            );


        monthTitle.textContent =
            new Date(
                year,
                month,
                1
            ).toLocaleDateString(
                "en-US",
                {
                    month: "long",
                    year: "numeric"
                }
            );


        const grid =
            document.getElementById(
                "calendarGrid"
            );


        grid.innerHTML = "";


        /*
         * First day of current month
         */

        const firstDay =
            new Date(
                year,
                month,
                1
            );


        /*
         * Number of days
         */

        const daysInMonth =
            new Date(
                year,
                month + 1,
                0
            ).getDate();


        /*
         * Previous month
         */

        const previousMonthDays =
            new Date(
                year,
                month,
                0
            ).getDate();


        const startDay =
            firstDay.getDay();


        /*
         * Previous month dates
         */

        for (
            let i = startDay - 1;
            i >= 0;
            i--
        ) {

            const day =
                previousMonthDays - i;


            const cell =
                createCalendarDay(
                    new Date(
                        year,
                        month - 1,
                        day
                    ),
                    true
                );


            grid.appendChild(cell);

        }


        /*
         * Current month
         */

        for (
            let day = 1;
            day <= daysInMonth;
            day++
        ) {

            const date =
                new Date(
                    year,
                    month,
                    day
                );


            const cell =
                createCalendarDay(
                    date,
                    false
                );


            grid.appendChild(cell);

        }


        /*
         * Next month
         */

        const totalCells =
            grid.children.length;


        const remaining =
            42 - totalCells;


        for (
            let day = 1;
            day <= remaining;
            day++
        ) {

            const cell =
                createCalendarDay(
                    new Date(
                        year,
                        month + 1,
                        day
                    ),
                    true
                );


            grid.appendChild(cell);

        }

    }


    function createCalendarDay(
        date,
        otherMonth
    ) {

        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "calendar-day";


        if (otherMonth) {

            cell.classList.add(
                "other-month"
            );

        }


        const span =
            document.createElement(
                "span"
            );


        span.textContent =
            date.getDate();


        /*
         * Today
         */

        if (
            isSameDate(
                date,
                today
            )
        ) {

            cell.classList.add(
                "today"
            );

        }


        /*
         * Important date
         */

        if (
            importantDates.includes(
                formatDateKey(date)
            )
        ) {

            cell.classList.add(
                "has-event"
            );

        }


        cell.appendChild(span);


        return cell;

    }


    document
        .getElementById(
            "previousMonth"
        )
        .addEventListener(
            "click",
            () => {

                calendarDate.setMonth(
                    calendarDate.getMonth() - 1
                );

                renderCalendar();

            }
        );


    document
        .getElementById(
            "nextMonth"
        )
        .addEventListener(
            "click",
            () => {

                calendarDate.setMonth(
                    calendarDate.getMonth() + 1
                );

                renderCalendar();

            }
        );


    renderCalendar();

</script>

</body>
</html>
